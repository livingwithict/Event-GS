version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
    depends_on:
      - postgres
    volumes:
      - .:/var/www/html

  queue:
    build: .
    command: php artisan queue:work --tries=3
    depends_on:
      - app
    volumes:
      - .:/var/www/html

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: event_management
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  pgdata:
